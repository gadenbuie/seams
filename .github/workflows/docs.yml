# Build the docmd docs site and deploy it to GitHub Pages.
#
# One-time setup: repo Settings → Pages → Build and deployment → Source:
# "GitHub Actions".
#
# The site deploys to this repo's project Pages site. Because the user site
# (gadenbuie.github.io) serves the custom domain pkg.garrickadenbuie.com,
# this site is live at https://pkg.garrickadenbuie.com/seams/, which is the
# `url` in docmd.config.json.

name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "assets/**"
      - "README.md"
      - "docmd.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the docs site
        run: npx --no-install docmd build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
