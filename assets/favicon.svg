<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    The seams favicon: the s from the Fraunces wordmark on a dark square,
    hemmed in light stitching. The tints run light to deep along the seam,
    and the stitching stops short of the bottom right corner, like a seam
    left open to be finished.
  -->
  <defs>
    <linearGradient id="stitch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5a884"/>
      <stop offset="0.55" stop-color="#e5794e"/>
      <stop offset="1" stop-color="#c9541f"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="6" fill="#1f1311"/>
  <path d="M24 27.5 H8.5 A4 4 0 0 1 4.5 23.5 V8.5 A4 4 0 0 1 8.5 4.5 H23.5 A4 4 0 0 1 27.5 8.5 V23.5"
